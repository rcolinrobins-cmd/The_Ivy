<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ivy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system.css">
</head>
<body class="landing">

<header class="site-header site-header--compact">
  <a class="site-header__cta site-header__cta--spacer" aria-hidden="true" tabindex="-1">
    Join our journey
    <svg class="site-header__cta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
  </a>

  <div class="site-header__brand">
    <h1 class="site-title">The Ivy</h1>
    <p class="site-subtitle">Weddings <span class="dot">&bull;</span> Events <span class="dot">&bull;</span> Retail</p>
  </div>

  <a class="site-header__cta" id="join-journey" href="#">
    Join our journey
    <svg class="site-header__cta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
  </a>
</header>

<div class="split-hero">
  <div class="split-hero__carousel">
    <div class="carousel carousel--full">
      <div class="carousel-track">
        <div class="carousel-slide"><img src="images/carousel/1-exterior.jpg" alt="The Ivy exterior"></div>
        <div class="carousel-slide"><img src="images/carousel/2-night.jpg" alt="The Ivy at night"></div>
        <div class="carousel-slide"><img src="images/carousel/3-lobby.jpg" alt="The Ivy lobby"></div>
        <div class="carousel-slide"><img src="images/carousel/4-bridal-suite.png" alt="The Ivy bridal suite"></div>
        <div class="carousel-slide"><img src="images/carousel/5-sanctuary.jpg" alt="The Ivy sanctuary"></div>
      </div>
      <button class="carousel-arrow carousel-arrow--prev" aria-label="Previous slide">&#8249;</button>
      <button class="carousel-arrow carousel-arrow--next" aria-label="Next slide">&#8250;</button>
      <div class="carousel-dots"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="join-modal-overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="join-modal-title">
    <button class="modal-close" id="join-modal-close" type="button" aria-label="Close">&times;</button>
    <h2 id="join-modal-title">Join our Journey</h2>
    <form class="modal-form" id="join-modal-form">
      <label class="modal-field">
        <span>Name</span>
        <input type="text" name="name" required placeholder="Your name">
      </label>
      <label class="modal-field">
        <span>Email</span>
        <input type="email" name="email" required placeholder="Your email address">
      </label>
      <div class="modal-field">
        <span id="interest-label">I'm interested in</span>
        <div class="select" id="interest-select">
          <button type="button" class="select-trigger" id="interest-trigger" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="interest-label interest-trigger">
            <span class="select-value is-placeholder">Select an option</span>
            <svg class="select-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <ul class="select-options" role="listbox" id="interest-listbox" aria-labelledby="interest-label" tabindex="-1" hidden>
            <li class="select-option select-option--empty" aria-disabled="true">More options coming soon</li>
            <!-- TODO: replace with real options, e.g.: -->
            <!-- <li class="select-option" role="option" tabindex="-1" data-value="weddings">Weddings</li> -->
          </ul>
        </div>
        <input type="hidden" name="interest" id="interest-value">
      </div>
      <button type="submit">Submit</button>
    </form>
    <p class="modal-success" id="join-modal-success" hidden>Thanks — we'll be in touch!</p>
  </div>
</div>

<script>
  // Carousel
  (function () {
    var track = document.querySelector('.carousel-track');
    var slides = document.querySelectorAll('.carousel-slide');
    var dotsContainer = document.querySelector('.carousel-dots');
    var currentIndex = 0;

    // Wraps around: index -1 goes to the last slide, index === length goes
    // back to the first, so prev/next never dead-end at the ends.
    function goToSlide(index) {
      currentIndex = (index + slides.length) % slides.length;
      slides[currentIndex].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }

    slides.forEach(function (slide, i) {
      var dot = document.createElement('button');
      dot.className = 'carousel-dot' + (i === 0 ? ' is-active' : '');
      dot.setAttribute('aria-label', 'Go to slide ' + (i + 1));
      dot.addEventListener('click', function () {
        goToSlide(i);
      });
      dotsContainer.appendChild(dot);
    });

    var dots = document.querySelectorAll('.carousel-dot');

    document.querySelector('.carousel-arrow--prev').addEventListener('click', function () {
      goToSlide(currentIndex - 1);
    });
    document.querySelector('.carousel-arrow--next').addEventListener('click', function () {
      goToSlide(currentIndex + 1);
    });

    track.addEventListener('scroll', function () {
      var index = Math.round(track.scrollLeft / track.clientWidth);
      currentIndex = index;
      dots.forEach(function (d, i) {
        d.classList.toggle('is-active', i === index);
      });
    });
  })();

  // Custom "I'm interested in" dropdown — a styled trigger + listbox
  // standing in for a native <select>, since a native select's popup list
  // can't be styled consistently across browsers. The chosen value lives
  // in a same-named hidden input, so the surrounding form works the same
  // as it would with a real <select>.
  (function () {
    var select = document.getElementById('interest-select');
    var trigger = document.getElementById('interest-trigger');
    var listbox = document.getElementById('interest-listbox');
    var valueInput = document.getElementById('interest-value');
    var valueLabel = trigger.querySelector('.select-value');
    var placeholderText = valueLabel.textContent;

    function getOptions() {
      return Array.prototype.slice.call(listbox.querySelectorAll('.select-option[role="option"]'));
    }

    function isOpen() {
      return !listbox.hidden;
    }

    function openList() {
      listbox.hidden = false;
      trigger.classList.add('is-open');
      trigger.setAttribute('aria-expanded', 'true');
      document.addEventListener('click', onDocumentClick);
      document.addEventListener('keydown', onListKeydown);
    }

    function closeList() {
      listbox.hidden = true;
      trigger.classList.remove('is-open');
      trigger.setAttribute('aria-expanded', 'false');
      document.removeEventListener('click', onDocumentClick);
      document.removeEventListener('keydown', onListKeydown);
    }

    function selectOption(option) {
      valueInput.value = option.getAttribute('data-value') || '';
      valueLabel.textContent = option.textContent;
      valueLabel.classList.remove('is-placeholder');
      getOptions().forEach(function (o) {
        o.setAttribute('aria-selected', o === option ? 'true' : 'false');
      });
      closeList();
      trigger.focus();
    }

    function onDocumentClick(e) {
      if (!select.contains(e.target)) closeList();
    }

    function onListKeydown(e) {
      var options = getOptions();
      var activeIndex = options.indexOf(document.activeElement);

      if (e.key === 'Escape') {
        e.preventDefault();
        closeList();
        trigger.focus();
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        (options[activeIndex + 1] || options[0]).focus();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        (options[activeIndex - 1] || options[options.length - 1]).focus();
      } else if ((e.key === 'Enter' || e.key === ' ') && activeIndex > -1) {
        e.preventDefault();
        selectOption(options[activeIndex]);
      }
    }

    trigger.addEventListener('click', function (e) {
      // Without this, opening also immediately re-fires this same click on
      // the document listener that openList() is about to attach (it's
      // still mid-bubble toward document) — harmless here only because
      // onDocumentClick happens to ignore clicks inside .select, but
      // stopping it outright removes the doubt.
      e.stopPropagation();
      if (isOpen()) {
        closeList();
      } else {
        openList();
      }
    });

    // Open (and jump straight into the list) when reaching the trigger by
    // keyboard, matching how a native select responds to these keys.
    trigger.addEventListener('keydown', function (e) {
      if (!isOpen() && (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault();
        // Stop this keydown from also reaching the document listener that
        // openList() attaches below — it's still mid-bubble toward
        // document, so without this it would immediately reprocess this
        // same ArrowDown against the option we're about to focus, skipping
        // past it to the second option instead of landing on the first.
        e.stopPropagation();
        openList();
        var options = getOptions();
        if (options[0]) options[0].focus();
      }
    });

    getOptions().forEach(function (option) {
      option.addEventListener('click', function () {
        selectOption(option);
      });
    });

    // Called by the modal's open handler so reopening starts from a clean
    // "Select an option" state rather than a previous choice.
    select.resetSelect = function () {
      valueInput.value = '';
      valueLabel.textContent = placeholderText;
      valueLabel.classList.add('is-placeholder');
      getOptions().forEach(function (o) {
        o.setAttribute('aria-selected', 'false');
      });
      closeList();
    };
  })();

  // "Join our journey" modal
  (function () {
    var openBtn = document.getElementById('join-journey');
    var overlay = document.getElementById('join-modal-overlay');
    var closeBtn = document.getElementById('join-modal-close');
    var form = document.getElementById('join-modal-form');
    var success = document.getElementById('join-modal-success');
    var interestSelect = document.getElementById('interest-select');
    var lastFocused = null;

    function openModal(e) {
      e.preventDefault();
      lastFocused = document.activeElement;
      form.hidden = false;
      success.hidden = true;
      form.reset();
      if (interestSelect.resetSelect) interestSelect.resetSelect();
      overlay.classList.add('is-open');
      document.addEventListener('keydown', onKeydown);
      var firstField = form.querySelector('input, select');
      if (firstField) firstField.focus();
    }

    function closeModal() {
      overlay.classList.remove('is-open');
      document.removeEventListener('keydown', onKeydown);
      if (lastFocused) lastFocused.focus();
    }

    function onKeydown(e) {
      if (e.key === 'Escape') closeModal();
    }

    openBtn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);

    // Close when clicking the dark backdrop, but not the modal box itself.
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closeModal();
    });

    // NOTE: not yet connected to a backend. The next step is to wire this
    // up to a Google Sheet (via a Google Apps Script web app endpoint) so
    // submissions here get recorded.
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      // TODO: POST this.name.value / this.email.value / this.interest.value
      // to the Google Apps Script web app URL once available.
      form.hidden = true;
      success.hidden = false;
    });
  })();
</script>

</body>
</html>
